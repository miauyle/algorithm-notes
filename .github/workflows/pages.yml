name: Deploy site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Injects the correct base path for a project site, so the build does not
      # depend on `baseurl` being right in _config.yml.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Browser brand verification
        env:
          BASEURL: /algorithm-notes
          EXPECTED_LOGO: logo-theme.svg
          EXPECTED_FAVICON: favicon-algorithm.svg
        run: |
          npm install --prefix "$RUNNER_TEMP/brand-ui" --no-audit --no-fund --ignore-scripts playwright@1.51.1
          "$RUNNER_TEMP/brand-ui/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/brand-ui/node_modules" node scripts/check_brand_ui.cjs

      - name: Validate Edit this page links
        run: |
          ruby <<'RUBY'
          require "yaml"

          config = YAML.load_file("_config.yml")
          edit = config.dig("docsteer", "edit_page") || {}
          expected_repo = "https://github.com/#{ENV.fetch("GITHUB_REPOSITORY")}"
          abort "edit_page.repo must be #{expected_repo}" unless edit["repo"] == expected_repo

          prefix = "#{edit["repo"]}/edit/#{edit["branch"]}/"
          links = Dir["_site/**/*.html"].flat_map do |html|
            File.read(html).scan(/<a class="doc-head__edit" href="([^"]+)"/).flatten.map { |href| [html, href] }
          end
          abort "No Edit this page links found in built site" if links.empty?

          errors = []
          links.each do |html, href|
            unless href.start_with?(prefix)
              errors << "#{html}: unexpected edit URL #{href}"
              next
            end
            source = href.delete_prefix(prefix)
            errors << "#{html}: source file not found: #{source}" unless File.file?(source)
          end
          abort errors.join("\n") unless errors.empty?
          puts "Validated #{links.length} Edit this page links."
          RUBY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
